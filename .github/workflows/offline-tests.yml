name: Offline application checks

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-pc.txt
      - run: python -m pip install -r requirements-pc.txt
      - name: All application regressions, including retained manual mapping tests
        run: python -B -m unittest discover -s app -p 'test_*.py'
      - name: MCU production C and PC protocol offline tests (no hardware)
        run: python -B mcu/build.py --host-tests --name ci-mcu-v11
      - name: Build standalone manual mapping package
        run: python -B scripts/build_package.py --name ci-manual-mapping
      - name: Packaged offline regression suite
        run: python -B -m unittest discover -s dist/ci-manual-mapping/package -p 'test_manual_mapping*.py'
      - name: Build independent simple point-to-point package
        run: python -B scripts/build_simple_p2p_package.py --name ci-simple-p2p
      - name: Packaged simple point-to-point regression suite
        run: python -B -m unittest discover -s dist/ci-simple-p2p/package -p 'test_simple*.py'
      - name: Packaged local task remote operations
        run: python -B -m unittest discover -s dist/ci-simple-p2p/package -p 'test_local_p2p_remote.py'
